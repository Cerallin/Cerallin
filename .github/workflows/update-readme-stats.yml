name: Update README stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点运行
  workflow_dispatch:      # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN 无法读取 repositories.stargazers（会 403）。
      # secrets.GH_PAT 为空时 action 会静默回退到 GITHUB_TOKEN，因此这里显式校验。
      - name: Require GH_PAT secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Missing repository secret GH_PAT."
            echo "Create a classic PAT with read:user (add repo for private contributions),"
            echo "then add it as Actions secret named GH_PAT and re-run this workflow."
            exit 1
          fi

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=30,e96443,904e95&title_color=fff&text_color=fff
          path: profile/stats.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=HTML,pug,stylus,TeX,php
          path: profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}
          path: profile/trophy.svg
          token: ${{ secrets.GH_PAT }}

      - name: Verify generated SVGs
        run: |
          failed=0
          for f in profile/stats.svg profile/top-langs.svg profile/trophy.svg; do
            if ! test -s "$f"; then
              echo "::error::$f is missing or empty"
              failed=1
              continue
            fi
            if grep -Eq "Something went wrong|Resource not accessible by integration|Failed to fetch user info" "$f"; then
              echo "::error::$f still contains an error card; check that GH_PAT is a valid classic PAT with read:user"
              failed=1
            fi
          done
          exit "$failed"

      - name: Commit SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update README stats SVGs"
          git push
