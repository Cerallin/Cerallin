name: Update README stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点运行
  workflow_dispatch:      # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # GITHUB_TOKEN 可用：stats-extended / trophy(master) 已改用 stargazerCount，
      # 不再查询会被安装类 token 拒绝的 repositories.stargazers 连接。
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=30,e96443,904e95&title_color=fff&text_color=fff
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=HTML,pug,stylus,TeX,php
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # 钉在含 stargazerCount 修复的 master（0dbd570+）；v1.0 标签仍会 403。
      - name: Generate trophy
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7 # master
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated SVGs
        run: |
          failed=0
          for f in profile/stats.svg profile/top-langs.svg profile/trophy.svg; do
            if ! test -s "$f"; then
              echo "::error::$f is missing or empty"
              failed=1
              continue
            fi
            if grep -Eq "Something went wrong|Resource not accessible by integration|Failed to fetch user info" "$f"; then
              echo "::error::$f still contains an error card"
              failed=1
            fi
          done
          exit "$failed"

      - name: Commit SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update README stats SVGs"
          git push
